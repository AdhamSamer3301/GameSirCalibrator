name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Build and test
        run: xcodebuild -project GameSirCalibrator.xcodeproj -scheme GameSirCalibrator -destination 'platform=macOS' test
